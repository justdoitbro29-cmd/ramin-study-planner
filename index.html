<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramin Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <h1 class="splash-text">Ramin</h1>
  </div>

  <!-- Main App -->
  <div id="app" style="display: none;">
    <header>
      <h1>📘 Ramin's Study Planner</h1>
    </header>

    <main>
      <section>
        <h2>SSC 2026 Syllabus</h2>
        <p>এখানে তুমি NCTB syllabus অনুযায়ী পড়াশোনা plan করতে পারবে।</p>
      </section>

      <section>
        <h2>Auto Study Plan</h2>
        <button onclick="generatePlan()">Generate Plan</button>
        <div id="plan-output"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
